<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>TPQ Smart - EMIS Bridge</title>
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            color: #333;
            background: #f8f9fa;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .header img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }

        .title {
            font-weight: bold;
            font-size: 14px;
            color: #0d6efd;
        }

        .subtitle {
            font-size: 11px;
            color: #6c757d;
        }

        .status-box {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .status-row:last-child {
            margin-bottom: 0;
        }

        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .badge-success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .badge-warning {
            background: #fff3cd;
            color: #664d03;
        }

        .btn-block {
            display: block;
            width: 100%;
            padding: 8px 12px;
            text-align: center;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            margin-bottom: 8px;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: #0d6efd;
            color: white;
        }

        .btn-primary:hover {
            background: #0b5ed7;
        }

        .btn-outline {
            background: white;
            color: #495057;
            border: 1px solid #ced4da;
        }

        .btn-outline:hover {
            background: #e9ecef;
        }

        .footer {
            font-size: 11px;
            text-align: center;
            color: #adb5bd;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icons/icon48.png" alt="Logo">
        <div>
            <div class="title">TPQ Smart - EMIS Bridge <span
                    style="font-size: 10px; background: #e0e7ff; color: #3730a3; padding: 1px 5px; border-radius: 8px; font-weight: normal; vertical-align: middle;">v1.6.1</span>
            </div>
            <div class="subtitle">Asisten Pengisian Data Santri EMIS 4.0</div>
        </div>
    </div>

    <div class="status-box">
        <div class="status-row">
            <span>Status Ekstensi:</span>
            <span class="badge badge-success">Aktif ✓</span>
        </div>
        <div class="status-row">
            <span>Mode Kerja:</span>
            <button id="btnToggleMode"
                style="cursor: pointer; border: 1px solid #198754; background: #d1e7dd; color: #0f5132; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 11px;"
                title="Klik untuk ganti mode">
                ⚡ Full Otomatis
            </button>
        </div>
    </div>

    <a href="http://localhost/tpqsmart/backend/santri/showSantriEmis" target="_blank" class="btn-block btn-primary">
        🚀 Buka Data Santri di TPQ Smart
    </a>

    <a href="https://emis.kemenag.go.id" target="_blank" class="btn-block btn-outline">
        🌐 Buka Portal EMIS 4.0
    </a>

    <div class="footer">
        TPQ Smart Automation v1.6.1 © 2026
    </div>
    <script src="popup.js"></script>
</body>

</html>
